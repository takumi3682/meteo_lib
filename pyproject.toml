[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteo_lib"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4",
  "pandas",
  "numpy",
  "matplotlib",
  "requests",
  "xarray",
  "metpy",
  "plotly",
]

[tool.setuptools]
packages = ["meteo_lib"]
package-dir = {"meteo_lib" = "."}

[tool.setuptools.package-data]
meteo_lib = ["data/*.csv", "data/*.index4"]