# ~/Projects/meteo_lib/meteo_lib/pyproject.toml
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meteo_lib"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4",
  "pandas",
  "numpy",
  "matplotlib",
  "requests",
  "xarray",
  "metpy",
  "plotly",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["meteo_lib*"]